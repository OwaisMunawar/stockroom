name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Strict types, boundaries and coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run doctor
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: coverage/lcov.info
  server:
    name: Reference server image
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -f server/Dockerfile -t stockroom-reference .
      - name: Health and catalog smoke test
        run: |
          docker run -d --name stockroom -p 8057:8057 stockroom-reference
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8057/health; then
              curl -fsS http://127.0.0.1:8057/v1/catalog
              exit 0
            fi
            sleep 1
          done
          docker logs stockroom
          exit 1
  ios:
    name: Unsigned iOS release build
    needs: quality
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: SwiftLint 0.65.1
        run: |
          curl -fLsS https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip -o "$RUNNER_TEMP/swiftlint.zip"
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          "$RUNNER_TEMP/swiftlint/swiftlint" lint --strict --no-cache modules/stockroom-intelligence/ios/StockroomIntelligenceModule.swift
      - run: bash tool/build-ios.sh
  android:
    name: Android debug build
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a
